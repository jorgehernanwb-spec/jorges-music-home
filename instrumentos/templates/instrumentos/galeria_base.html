{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} · JORGE'S MUSIC HOME</title>
    <link rel="stylesheet" href="{% static 'instrumentos/css/pie-global.css' %}">
    <link rel="stylesheet" href="{% static 'instrumentos/css/galeria.css' %}">
    {% block scripts %}{% endblock %}
</head>
<body class="pagina-con-pie galeria{% block clase_pagina %}{% endblock %}">
    <header class="galeria-cabecera">
        <a class="galeria-marca" href="{% url 'instrumentos:recepcion' %}">JORGE'S <span>MUSIC HOME</span></a>
        <nav aria-label="Navegación de la galería">
            <a href="{% url 'instrumentos:recepcion' %}">Recepción</a>
            <a href="{% url 'instrumentos:coleccion' %}"{% if request.resolver_match.url_name == 'coleccion' %} aria-current="page"{% endif %}>Instrumentos</a>
        </nav>
    </header>
    <main class="galeria-contenido">
        {% block contenido %}{% endblock %}
    </main>
    {% include 'instrumentos/pie_global.html' %}
</body>
</html>
