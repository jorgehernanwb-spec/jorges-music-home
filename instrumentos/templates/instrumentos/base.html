
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORGE'S MUSIC HOME</title>

    <link rel="stylesheet"
          href="{% static 'instrumentos/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'instrumentos/css/pie-global.css' %}">
</head>

<body class="pagina-con-pie pagina-inventario{% block clase_pagina %}{% endblock %}">
    <header class="encabezado">
        <a href="{% url 'instrumentos:inicio' %}" class="marca">
            JORGE'S <span>MUSIC HOME</span>
        </a>

        <nav aria-label="Navegación principal">
            <a href="{% url 'instrumentos:recepcion' %}">Recepción</a>
            <a href="{% url 'instrumentos:lista' %}">
                Instrumentos
            </a>
            <a href="{% url 'instrumentos:crear' %}">
                Nuevo instrumento
            </a>
        </nav>
    </header>

    <main class="contenido">
        {% if messages %}
            {% for message in messages %}
                <div class="mensaje" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}
    </main>

    {% include 'instrumentos/pie_global.html' %}
</body>
</html>
